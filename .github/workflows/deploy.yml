name: Deploy production on version tag

on:
  push:
    tags:
      - "v*"

jobs:
  # A tag used to deploy straight from the checkout: lint, types, tests and the
  # build all ran on pull requests and on main, and none of them ran here, so a
  # tag cut from a branch that never passed CI -- or from a commit where the
  # build was broken after merge -- shipped anyway. The deploy now waits for
  # the same verification, called rather than copied so the two cannot drift.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
