name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Callable, so the tag deploy runs exactly this verification rather than its
  # own copy that can drift out of step with it.
  workflow_call:

concurrency:
  # A workflow_call run shares the caller's ref, so it must not cancel the
  # caller's own group. Keyed by workflow as well as ref for that reason.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
